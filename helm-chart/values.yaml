environment: production


bun:
  replicas: 1
  image: qwik-aesthetic
  port: 3000
  tag: auth
  env:
    API_BASE_URL: null
    API_TOKEN: null
    SUPABASE_URL: null
    SUPABASE_KEY: null

n8n:
  replicas: 1
  image: docker.n8n.io/n8nio/n8n
  tag: latest
  port: 5678
  env:
    N8N_HOST: "aesthetic-app-n8n-svc"
    WEBHOOK_URL: null
    N8N_ENCRYPTION_KEY: null
    NODE_ENV: "production"
    GENERIC_TIMEZONE: null
    N8N_DIAGNOSTICS_ENABLED: false
    N8N_VERSION_NOTIFICATIONS_ENABLED: false
    N8N_TEMPLATES_ENABLED: false
    DOMAIN_NAME: null
  initFiles:
    enabled: true
    credsPath: "n8n_files/creds.json"
    workflowsPath: "n8n_files/workflows.json"
