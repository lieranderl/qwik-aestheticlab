---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install essential packages
  apt:
    name:
      - snapd
      - curl
      - wget
      - software-properties-common
      - apt-transport-https
      - ca-certificates
      - gnupg
      - net-tools
      - ufw
      - python3-pip
      - python3-kubernetes
    state: present
    update_cache: yes

- name: Download Helm command line tool
  ansible.builtin.uri:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    return_content: true
  register: helm_installer

- name: Install Helm
  ansible.builtin.command:
    cmd: bash
    stdin: "{{ helm_installer.content }}"
    creates: /usr/local/bin/helm
  environment:
    DESIRED_VERSION: "{{ helm_version | default('') }}"

- name: Configure and enable firewall
  ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    state: enabled
    policy: deny
  loop:
    - { rule: "allow", port: "22" }
    - { rule: "allow", port: "80" }
    - { rule: "allow", port: "443" }
    - { rule: "allow", port: "7946" }
    - { rule: "allow", port: "16443" }
    - { rule: "allow", port: "10443" }
    - { rule: "allow", port: "30000:32767", proto: "tcp" }
  notify: reload firewall

- name: Upgrade all packages
  apt:
    upgrade: dist
    autoremove: yes

- name: Check if reboot is required (Ubuntu/Debian)
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Reboot system if required
  ansible.builtin.reboot:
    reboot_timeout: 300
  when: reboot_required_file.stat.exists
