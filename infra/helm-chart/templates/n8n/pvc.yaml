apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Release.Name }}-n8n-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hcloud-volumes
  csi:
   # hetzner-csi-driver
    driver: csi.hcloud.com
    volumeHandle: 102394029  # Replace this with your existing volume ID
