name: Quality and security

on:
  workflow_call:
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Check formatting and lint without modifying files
        run: bunx --bun biome ci .

  verify:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Typecheck
        run: bun run build.types

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Chromium smoke tests
        run: bunx playwright test --project=chromium
        env:
          SUPABASE_URL: https://example.invalid
          SUPABASE_KEY: sb_publishable_ci_placeholder

      - name: Dependency audit
        run: bun audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Scan committed history for unacknowledged secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build production container
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: aestheticlab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root runtime and application behavior
        env:
          SUPABASE_URL: https://example.invalid
          SUPABASE_KEY: sb_publishable_ci_placeholder
          SMOKE_SKIP_DEPENDENCY: "true"
        run: |
          test "$(docker image inspect aestheticlab:ci --format '{{.Config.User}}')" = "65532:65532"
          container_id=$(docker create aestheticlab:ci)
          docker export "$container_id" --output /tmp/aestheticlab-ci.tar
          if tar --list --file=/tmp/aestheticlab-ci.tar | grep --extended-regexp '^app/node_modules/.*\.(node|so|dylib)$'; then
            echo "Native runtime dependency cannot be copied from BUILDPLATFORM into TARGETPLATFORM" >&2
            docker rm "$container_id" >/dev/null
            exit 1
          fi
          docker rm "$container_id" >/dev/null
          docker run --detach --rm --name aestheticlab-ci --publish 127.0.0.1:3000:3000 --env SUPABASE_URL --env SUPABASE_KEY aestheticlab:ci
          trap 'docker stop aestheticlab-ci >/dev/null 2>&1 || true' EXIT
          ./scripts/smoke-deployment.sh http://127.0.0.1:3000

      - name: Scan production container
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: aestheticlab:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@000eeb8522f0572907c393e8151076c205fdba1b # v1.0.6
        with:
          tofu_version: 1.12.2
          tofu_wrapper: false

      - name: Check formatting
        run: tofu -chdir=infra fmt -check -recursive

      - name: Initialize providers without backend
        run: tofu -chdir=infra init -backend=false -input=false

      - name: Validate configuration
        run: tofu -chdir=infra validate
