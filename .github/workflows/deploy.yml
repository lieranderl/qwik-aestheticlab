name: Deploy to Cloud Run

on:
  push:
    branches:
      - staging
  release:
    types: [created]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
  STAGE_SERVICE: ${{ secrets.STAGE_SERVICE }}
  PROD_SERVICE: ${{ secrets.PROD_SERVICE }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun ci

      - name: Verify
        run: bun run verify

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    permissions:
      actions: write
      contents: read
    outputs:
      image_tag: ${{ steps.set_tag.outputs.TAG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set Docker tag
        id: set_tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
            # Enforce semantic versioning vX.Y.Z
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "❌ Error: Release tag '$RELEASE_TAG' is not in semantic version format (vX.Y.Z)."
              exit 1
            fi
            echo "✅ Using release tag: $RELEASE_TAG"
            echo "TAG=$RELEASE_TAG" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "✅ Using short SHA: $SHORT_SHA"
            echo "TAG=${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push image with cache
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ steps.set_tag.outputs.TAG }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Deploy to Cloud Run (staging)
        if: github.ref == 'refs/heads/staging'
        run: |
          echo "🚀 Deploying staging build: $DOCKER_IMAGE:${{ needs.build.outputs.image_tag }}"
          gcloud run deploy $STAGE_SERVICE \
            --image=docker.io/$DOCKER_IMAGE:${{ needs.build.outputs.image_tag }} \
            --region=$GCP_REGION \
            --project=$GCP_PROJECT \
            --min-instances=0 \
            --max-instances=1 \
            --set-env-vars=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --set-secrets=SUPABASE_KEY=SUPABASE_KEY:latest

      - name: Deploy to Cloud Run (prod)
        if: github.event_name == 'release'
        run: |
          echo "🚀 Deploying production release: $DOCKER_IMAGE:${{ needs.build.outputs.image_tag }}"
          gcloud run deploy $PROD_SERVICE \
            --image=docker.io/$DOCKER_IMAGE:${{ needs.build.outputs.image_tag }} \
            --region=$GCP_REGION \
            --project=$GCP_PROJECT \
            --min-instances=1 \
            --max-instances=1 \
            --set-env-vars=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --set-secrets=SUPABASE_KEY=SUPABASE_KEY:latest
