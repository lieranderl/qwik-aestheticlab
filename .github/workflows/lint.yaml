# .github/workflows/lint.yml
name: Quality Check

on:
  pull_request:
    branches:
      - "**"

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome
        run: bun run biome

      - name: Run Type Check
        run: bun run build.types

      - name: Run Production Build
        run: bun run build
