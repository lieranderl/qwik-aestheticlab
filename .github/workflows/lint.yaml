# .github/workflows/lint.yml
name: Lint Check

on:
  push:
    branches:
      - '**'   # all branches
    paths:
      - 'src/**'
      - 'package.json'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Bun
      run: |
        curl -fsSL https://bun.sh/install | bash
        echo "${HOME}/.bun/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: bun install

    - name: Run Linter (Biome, ESLint)
      run: |
        bun run biome
        bun run lint

