# .github/workflows/release-prod.yml
name: Release to Prod



on:
  push:
    branches:
      - prod

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      path_to_kubeconfig: infra/terraform/prod-aesthetic-cluster_kubeconfig.yaml

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install Helm
      run: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

    - name: Install kubectl
      uses: azure/setup-kubectl@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Install Bun
      run: |
        curl -fsSL https://bun.sh/install | bash
        echo "${HOME}/.bun/bin" >> $GITHUB_PATH

    - name: Docker login
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Restore kubeconfig
      run: |
        mkdir -p infra/terraform
        echo "${{ secrets.KUBECONFIG }}" > $path_to_kubeconfig

    - name: Generate Tag
      id: tag
      run: echo "TAG=${{ vars.ENV_PROD }}-v1.0-$(date +'%Y%m%d')-${{ github.run_number }}" >> $GITHUB_ENV
      
    - name: Release app
      env:
        GENERIC_TIMEZONE : ${{ vars.GENERIC_TIMEZONE }}
        ENV: ${{ vars.ENV_PROD }}
        EMAIL: ${{ vars.EMAIL }}
        TAG: ${{ env.TAG }}
        VOLUME_ID: ${{vars.VOLUME_ID_STAGE}}
        API_TOKEN: ${{ secrets.API_TOKEN }}
        DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
        KUBECONFIG: "/home/runner/work/qwik-aestheticlab/qwik-aestheticlab/$path_to_kubeconfig"
        N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        WEBHOOK: ${{ secrets.WEBHOOK }}
      run: |
        make release
