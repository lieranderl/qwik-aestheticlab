# .github/workflows/release-production.yml
name: Release to production

on:
  push:
    tags:
      - "v*" # triggers when you push tags like v1.0.0, v2.3.1, etc.

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PATH_TO_KUBECONFIG: infra/terraform/prod-aesthetic-cluster_kubeconfig.yaml

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "${HOME}/.bun/bin" >> $GITHUB_PATH

      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Restore kubeconfig
        run: |
          mkdir -p infra/terraform
          echo "${{ secrets.KUBECONFIG_PROD }}" > ${{ env.PATH_TO_KUBECONFIG }}

      - name: Set Tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Release app
        env:
          GENERIC_TIMEZONE: ${{ vars.GENERIC_TIMEZONE }}
          ENV: ${{ vars.ENV_PROD}}
          EMAIL: ${{ vars.EMAIL }}
          TAG: ${{ env.TAG }}
          VOLUME_ID: ${{ vars.VOLUME_ID_PROD }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME_PROD }}
          KUBECONFIG: ${{ github.workspace }}/${{ env.PATH_TO_KUBECONFIG }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          WEBHOOK: ${{ secrets.WEBHOOK }}
        run: |
          make release
