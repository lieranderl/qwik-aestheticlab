version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 5
    ignore:
      # @qwik.dev/core 2.x requires vite ">=8 <9".
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # @qwik.dev/core 2.0.0-rc.0 requires vitest ">=2 <5"; revisit when the range widens.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    groups:
      qwik:
        patterns:
          - "@qwik.dev/*"
          - "@qwikest/*"
          - "compiled-i18n"
          - "qwik-*"
      styling:
        patterns:
          - "@tailwindcss/*"
          - "tailwindcss*"
          - "daisyui"
      test-and-build-tooling:
        dependency-type: "development"
        patterns:
          - "@biomejs/*"
          - "@playwright/*"
          - "@types/*"
          - "@vitest/*"
          - "typescript"
          - "vite"
          - "vitest"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
      timezone: "Europe/Brussels"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Europe/Brussels"
    commit-message:
      prefix: "docker"
